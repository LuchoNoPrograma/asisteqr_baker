<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema institucional de asistencia de la Unidad Educativa Baker">
  <meta name="theme-color" content="#17365f">
  <meta property="og:title" content="AsisteQR Baker">
  <meta property="og:description" content="Gestión institucional de asistencia, cursos y reportes.">
  <meta property="og:image" content="images/baker-campus.jpg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AsisteQR Baker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/baker-mark.svg">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AsisteQR Baker | Gestión de asistencia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f7f9fb;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #f7f9fb;
      transition: opacity 180ms ease;
    }
    #app-loading img {
      width: min(76vw, 490px);
      height: auto;
    }
    #app-loading .loading-line {
      width: min(42vw, 210px);
      height: 3px;
      margin: 20px auto 0;
      overflow: hidden;
      background: #d8dee7;
    }
    #app-loading .loading-line::after {
      content: '';
      display: block;
      width: 42%;
      height: 100%;
      background: #19704d;
      animation: institutional-loading 1.1s ease-in-out infinite alternate;
    }
    @keyframes institutional-loading {
      from { transform: translateX(0); }
      to { transform: translateX(138%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loading .loading-line::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Cargando AsisteQR Baker">
    <div>
      <img src="icons/baker-title.svg" alt="AsisteQR Baker, Unidad Educativa Baker">
      <div class="loading-line" aria-hidden="true"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
